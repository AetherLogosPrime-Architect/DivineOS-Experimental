name: Integrity Audit

# Server-side enforcement of integrity invariants that the local pre-commit
# hook tries to enforce but can be bypassed with --no-verify. This workflow
# runs in GitHub Actions where the agent has no write access, so it's the
# off-host anchor for the self-audit stack.
#
# PHASE 1 scope (this file):
#   - Verify: any commit in a PR that modifies a guardrail file must carry
#     an "External-Review: <id>" trailer in its commit message. This is a
#     purely textual check — the trailer's PRESENCE is verified, not the
#     referenced audit round's validity.
#
# What Phase 1 does NOT yet enforce (Phase 2 architectural work):
#   - That the referenced audit round actually exists in the Watchmen store
#   - That the round has CONFIRMS findings from user + external AI actors
#   - That the round's diff-hash matches the current diff
#   - That the referenced pre-reg exists and is open
#
#   Phase 2 requires committed audit-round and pre-reg state (or an external
#   DB that CI can query). That's a bigger architectural shift — deferred.
#   Phase 1 still closes the --no-verify bypass on the trailer requirement,
#   which is the biggest single integrity gap.

on:
  pull_request:
    branches: [main]
    # ready_for_review needed so the workflow fires when a draft PR is
    # promoted out of draft state. Default activity types
    # (opened/synchronize/reopened) skip the draft→ready transition.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  guardrail-trailer-check:
    name: multi-party-review
    runs-on: ubuntu-latest
    # SKIP ON DRAFTS (Andrew 2026-08-22). The same policy merge-review-check
    # below already carries, for the same reason: a draft should not accumulate
    # red marks before anyone has been asked to review it. Every open PR has sat
    # red on this check, and the red is not informative -- of course unfinished
    # work has no audit round yet. The round is the LAST station, not the first,
    # so this was reporting "incomplete" about work correctly still in progress.
    #
    # THIS IS NOT A RETURN OF THE 2026-08-15 REGRESSION, and the difference is
    # what makes it safe. That fix existed because the check was PUSH-ONLY and
    # therefore invisible until after the merge -- Andrew, in exasperation: "i
    # havent merged it because the multiparty review is skipped.. so when i do
    # it will fail.. i have said this repeatedly." A check that only runs AFTER
    # the merge cannot inform the merge.
    #
    # `ready_for_review` is in this workflow's trigger types (line 31), so
    # promoting a draft fires this job. The check still runs BEFORE the merge
    # decision, on exactly the PRs a human is being asked to act on. What is
    # removed is only noise on work nobody has yet claimed is finished.
    #
    # The `push` clause keeps the vault covered: what lands on main is still
    # checked unconditionally. Identical shape to tests.yml line 21.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    # Push-to-main only (Andrew 2026-08-13): "not every commit just every
    # merge to main, committing is allowed in your own workspace without any
    # audit, the github is the main vault/backup."
    #
    # This job checks each individual COMMIT for a trailer, which made every
    # amend-and-force-push cycle a fresh chance to fail — and on branches
    # checked out in a second worktree, `filter-branch` cannot rewrite the
    # history at all, so the requirement was unmeetable from here. The PR
    # path is already covered by merge-review below, which anchors on the
    # operator's approval of the head commit; that is the stronger check and
    # it does not care how the branch's individual commits were worded.
    #
    # Kept on push-to-main because that is the vault. What lands on main
    # still has to carry the trailer.
    #
    # NOW ALSO ON pull_request (2026-08-15). Andrew, repeatedly and finally
    # in exasperation: "i havent merged it because the multiparty review is
    # skipped.. so when i do it will fail.. i have said this repeatedly."
    #
    # He is right, and the skip was the actual defect. A check that only
    # runs AFTER the merge cannot inform the merge. It reported 'skipping'
    # on every PR, went red on main once the decision was irreversible, and
    # left a badge that cannot be cleaned without force-pushing main. Every
    # merge was a blind bet with an unrecoverable downside.
    #
    # The reason it was push-only was that per-commit trailers were
    # unmeetable on a branch (amend, force-push, worktrees where
    # filter-branch cannot rewrite history). The PR-body fallback removes
    # that: the branch satisfies the check through the PR body, which is
    # editable and fetched live. The original justification no longer holds,
    # so the restriction should not outlive it.
    steps:
      - name: Check out PR with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify guardrail-modifying commits carry External-Review trailer
        shell: bash
        # Token so the script can read the trailer off the PR body when the
        # squash-merge message snapshot missed it. Read-only use; without it
        # the lookup is skipped and the check behaves exactly as before.
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -e

          # Determine the commit range to check.
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          # Handle edge case: BASE_SHA may be all-zeros for initial push.
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || [ -z "$BASE_SHA" ]; then
            echo "No base commit available (initial push?). Skipping range check."
            exit 0
          fi

          # Delegate to the standalone script. Single source of truth,
          # covered by tests/test_ci_check_guardrail_trailer.py, including
          # tree-hash binding (Phase 2) and the meta-self-disclosure block.
          bash scripts/ci_check_guardrail_trailer.sh "$BASE_SHA" "$HEAD_SHA"

  mixed-pattern-merge-check:
    name: mixed-pattern-merge
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mixed-pattern-merge gate (claim ec844fcf)
        run: |
          set -e
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="HEAD~1"
            HEAD_SHA="HEAD"
          fi

          # Refuse PRs that contain BOTH file additions AND deletions in
          # the same src/divineos/core/<subsystem>/ directory. Catches the
          # PR-#230 shape where strip work bundles with template additions.
          # See scripts/check_mixed_pattern_merge.py for design rationale.
          python scripts/check_mixed_pattern_merge.py "$BASE_SHA" "$HEAD_SHA"

  merge-review-check:
    # Closes Marc audit finding #2026-07-16 #4: scripts/ci_merge_review_check.py
    # existed and claimed (in its own docstring) that the GitHub Action calls
    # it — but no job in this workflow actually did. The guardrail-trailer
    # gate above only checks trailer STRING PRESENCE, not that the referenced
    # audit round exists in the Watchmen store. This job invokes the script
    # so the round-existence + operator-approval-on-head checks actually run.
    name: merge-review
    runs-on: ubuntu-latest
    # Only meaningful on PR events (needs a PR number). Draft PRs skip
    # (same policy as guardrail-trailer-check above — audit-visibility
    # design: draft PRs don't accumulate red marks pre-audit).
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    steps:
      - name: Check out PR with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install divineos (needed for merge_review_gate import)
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run operator-anchored merge-review gate
        env:
          # gh CLI reads GH_TOKEN for `gh api` calls (fetching PR
          # reviews + metadata). github.token is scoped to this repo
          # and expires with the workflow run.
          GH_TOKEN: ${{ github.token }}
          # Preserve any emergency-bypass env var the operator sets at
          # workflow-dispatch time; the script requires >=20-char reason
          # and logs each use via record_emergency_use.
          DIVINEOS_MERGE_REVIEW_EMERGENCY_BYPASS: ${{ vars.MERGE_REVIEW_EMERGENCY_BYPASS }}
        run: |
          set -e
          python scripts/ci_merge_review_check.py \
            --pr "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}"
